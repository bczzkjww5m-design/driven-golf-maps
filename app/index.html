<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Driven Golf</title>
<!-- script ?v= matches APP_VERSION in js/store.js: bump both on every release so phones never mix old and new files -->
<!-- home-screen app: "Add to Home Screen" opens full screen as "Driven Golf" -->
<link rel="manifest" href="manifest.webmanifest?v=0.9.3-beta">
<meta name="theme-color" content="#1E3A2B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Driven Golf">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/favicon.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/leaflet-rotate@0.2.8/dist/leaflet-rotate-src.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&family=Jost:wght@400;500;600&display=swap">
<style>
  /* Driven Golf · Clubhouse Classic */
  :root {
    --hunter: #1E3A2B; --ivory: #F6F1E4; --paper: #FFFDF7; --brass: #B08D57; --claret: #7A1F2B; --lake: #3E6E8E; --ink: #1B1B18; --muted: #6B6457; --rule: #E3DAC6;
    --head: "Plus Jakarta Sans", system-ui, sans-serif; --text: "Jost", system-ui, sans-serif;
    /* older names the code still uses, mapped onto the palette */
    --turf: var(--hunter); --turf-2: var(--hunter); --pine: var(--hunter); --pine-2: var(--hunter); --lime: var(--brass); --flag: var(--claret); --water: var(--lake);
    --mist: var(--ivory); --line: var(--rule); --chalk: var(--ivory); --chalk-2: var(--rule); --red: var(--claret); --yellow: #A8862F; --gps: var(--lake); --ok: var(--hunter);
    font-family: var(--text); color: var(--ink); font-variant-numeric: lining-nums tabular-nums;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: var(--ivory); color: var(--ink); }
  body { -webkit-user-select: none; user-select: none; font: 400 15px/1.4 var(--text); }
  #app { height: 100%; }
  [hidden] { display: none !important; }
  button { font: inherit; color: inherit; }
  button:focus-visible, select:focus-visible, input:focus-visible, a:focus-visible { outline: 2px solid var(--lake); outline-offset: 2px; }
  .num, .big { font-variant-numeric: lining-nums tabular-nums; }
  .head { font-family: var(--head); }
  .caps { font: 600 11.5px var(--text); letter-spacing: .24em; text-transform: uppercase; }
  .brass { color: var(--brass); } .claret { color: var(--claret); } .it { font-style: italic; }

  /* screens and headers: hunter, ending in a 3px double brass rule */
  .screen { min-height: 100%; display: flex; flex-direction: column; padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 74px); }
  .screen.notabs { padding-bottom: 0; }
  .bar, .hero, .chead, .phead, .hhead { background: var(--hunter); color: var(--ivory); border-bottom: 3px double var(--brass); }
  .bar { padding: calc(env(safe-area-inset-top, 0px) + 12px) 16px 14px; display: flex; align-items: center; gap: 12px; }
  .bar h1 { font: 300 22px var(--head); margin: 0; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bar .back, .iconbtn { all: unset; cursor: pointer; width: 44px; height: 44px; border-radius: 999px; display: grid; place-items: center; font-size: 20px;
                         box-shadow: inset 0 0 0 1px var(--brass); color: var(--ivory); flex: 0 0 auto; }
  .body { padding: 18px 16px; display: flex; flex-direction: column; gap: 16px; max-width: 720px; width: 100%; margin: 0 auto; }
  h2 { display: flex; align-items: center; gap: 12px; margin: 6px 0 0; font: 600 11.5px var(--text); letter-spacing: .24em; text-transform: uppercase; color: var(--ink); }
  h2::after { content: ""; flex: 1; height: 1px; background: var(--brass); }
  /* framed cards: 1px brass border plus a second thin brass line just inside */
  .card { background: var(--paper); border: 1px solid var(--brass); outline: 1px solid var(--brass); outline-offset: -5px; padding: 18px; display: flex; flex-direction: column; gap: 10px; }
  .card h3 { margin: 0; font: 500 18px var(--head); }
  .card p { margin: 0; color: var(--muted); font-size: 14px; }
  .card.list { padding: 4px 16px; }
  /* buttons: hunter with a thin brass border and spaced capitals; secondary outlined in hunter */
  .btn { border: 1px solid var(--brass); border-radius: 0; min-height: 48px; padding: 12px 18px; font: 600 12.5px var(--text); letter-spacing: .2em; text-transform: uppercase;
         cursor: pointer; background: var(--hunter); color: var(--ivory); }
  .btn.alt { background: transparent; color: var(--hunter); border-color: var(--hunter); }
  .btn.red { background: var(--claret); border-color: var(--claret); }
  .btn.lime { background: transparent; color: var(--hunter); border-color: var(--hunter); }
  .btn.small { min-height: 44px; padding: 8px 12px; font-size: 11.5px; letter-spacing: .14em; }
  .btn:disabled { opacity: .4; cursor: default; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; }
  .row > .btn { flex: 1; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip { border: 1px solid var(--hunter); background: transparent; border-radius: 0; min-height: 44px; padding: 8px 12px; font: 500 13px var(--text); letter-spacing: .04em; cursor: pointer; color: var(--hunter); }
  .chip.on { background: var(--hunter); color: var(--ivory); }
  .chip.warn { border-color: var(--yellow); }
  /* lists: thin rules, not cards */
  .list { display: flex; flex-direction: column; }
  .item { display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 11px 0; border-bottom: 1px solid var(--rule); cursor: pointer; }
  .item:last-child { border-bottom: 0; }
  .item .grow { flex: 1; min-width: 0; }
  .item b { font: 500 16px var(--head); }
  .item small { display: block; color: var(--muted); font-size: 13px; margin-top: 1px; }
  .item > span:last-child { color: var(--brass); }
  .muted { color: var(--muted); font-size: 13px; }
  table.t { border-collapse: collapse; width: 100%; font-size: 13px; font-variant-numeric: tabular-nums; background: var(--paper); }
  table.t th { text-align: left; color: var(--muted); font-weight: 600; padding: 6px 4px; border-bottom: 1px solid var(--rule); letter-spacing: .1em; text-transform: uppercase; font-size: 11px; }
  table.t td { padding: 7px 4px; border-bottom: 1px solid var(--rule); vertical-align: top; }
  .tablewrap { overflow-x: auto; }
  .pill { display: inline-block; font: 600 11px var(--text); letter-spacing: .08em; padding: 2px 7px; border: 1px solid currentColor; }
  .pill.red { color: var(--claret); } .pill.yellow { color: #8A6A1F; } .pill.ok { color: var(--hunter); } .pill.blue { color: var(--lake); } .pill.lime { color: var(--brass); }
  .stat { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 0; border-top: 1px solid var(--rule); }
  .stat div { padding: 12px 4px; border-bottom: 1px solid var(--rule); }
  .stat b { display: block; font: 300 30px var(--head); font-variant-numeric: lining-nums tabular-nums; }
  .stat span { font-size: 12px; color: var(--muted); }
  label.f { display: flex; flex-direction: column; gap: 6px; font: 600 11px var(--text); letter-spacing: .18em; text-transform: uppercase; color: var(--muted); }
  input, select, textarea { font: 400 16px var(--text); min-height: 44px; padding: 9px 12px; border-radius: 0; border: 1px solid var(--rule); border-bottom-color: var(--brass); background: var(--paper); color: var(--ink);
                            letter-spacing: 0; text-transform: none; -webkit-user-select: text; user-select: text; }
  a { color: var(--claret); }
  .warn { background: var(--paper); border-left: 3px solid #A8862F; color: #5E4A17; padding: 10px 12px; font-size: 13.5px; }
  .warn.red { border-left-color: var(--claret); color: var(--claret); }
  .linkbtn { all: unset; cursor: pointer; color: var(--claret); font: 500 13px var(--text); text-decoration: underline; text-underline-offset: 3px; }
  .toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom, 0px) + 86px); background: var(--hunter); color: var(--ivory); border: 1px solid var(--brass);
           padding: 11px 16px; z-index: 5000; font-size: 14px; }
  .modal { position: fixed; inset: 0; background: #1B1B1873; z-index: 4000; display: flex; align-items: flex-end; justify-content: center; }
  .modal .inner { background: var(--ivory); width: 100%; max-width: 720px; max-height: 85%; overflow-y: auto; border-top: 3px double var(--brass);
                  padding: 20px 16px calc(env(safe-area-inset-bottom, 0px) + 16px); display: flex; flex-direction: column; gap: 12px; }
  .modal h3 { font: 300 24px var(--head); }
  .modal .item.hit b, .item.hit b { color: var(--claret); }

  /* crest + wordmark */
  .crest { display: block; flex: 0 0 auto; }
  .wordmark { display: flex; flex-direction: column; line-height: 1.1; }
  .wordmark b { font: 300 15px var(--head); letter-spacing: .32em; text-transform: uppercase; }
  .wordmark i { font: italic 300 11.5px/1.25 var(--head); color: var(--brass); }

  /* tab bar: hunter, double brass rule on top, short brass underline on the active tab */
  .tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 900; background: var(--hunter); border-top: 3px double var(--brass);
          padding: 4px 6px calc(env(safe-area-inset-bottom, 0px) + 4px); display: flex; justify-content: space-around; }
  .tabs button { all: unset; cursor: pointer; flex: 1; min-height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
                 font: 600 10px var(--text); letter-spacing: .18em; color: #CFC6B2; }
  .tabs button svg { width: 22px; height: 22px; }
  .tabs button.on { color: var(--ivory); }
  .tabs .dot { width: 22px; height: 2px; background: transparent; }
  .tabs button.on .dot { background: var(--brass); }

  /* the Clubhouse */
  .hero { padding: calc(env(safe-area-inset-top, 0px) + 14px) 16px 22px; }
  .hero .top { display: flex; align-items: center; gap: 12px; }
  .hero .top .grow { flex: 1; }
  .hero .eyebrow { margin-top: 18px; color: var(--brass); }
  .hero h1 { font: italic 300 30px var(--head); margin: 6px 0 8px; }
  .hero .hcpline { color: var(--brass); }
  .avatar { all: unset; cursor: pointer; width: 44px; height: 44px; border-radius: 999px; box-shadow: inset 0 0 0 1px var(--brass); color: var(--ivory); display: grid; place-items: center; font: 500 15px var(--head); letter-spacing: .06em; }
  .nextup .cname { font: 300 28px/1.15 var(--head); }
  .split { display: flex; align-items: stretch; border-top: 1px solid var(--rule); margin-top: 4px; }
  .split > * { flex: 1; text-align: center; padding: 12px 4px 2px; }
  .split > * + * { border-left: 1px solid var(--rule); }
  .bigstat { font: 300 44px/1 var(--head); color: var(--claret); }
  .focus { display: flex; gap: 16px; align-items: center; cursor: pointer; }
  .focus b { font: 500 17px var(--head); display: block; } .focus small { color: var(--muted); font-size: 13.5px; }
  .ccard, .hscroll, .fi { display: none; }

  /* course page */
  .chead { padding: calc(env(safe-area-inset-top, 0px) + 12px) 16px 18px; }
  .chead h1 { font: 300 30px/1.15 var(--head); margin: 14px 0 6px; }
  .chead .sub2 { color: var(--brass); }
  .teetable { border-collapse: collapse; width: 100%; }
  .teetable td { padding: 0 10px; height: 52px; border-bottom: 1px solid var(--rule); cursor: pointer; }
  .teetable tr:last-child td { border-bottom: 0; }
  .teetable .sq { width: 14px; height: 14px; display: inline-block; vertical-align: middle; box-shadow: inset 0 0 0 1px #0003; }
  .teetable .tn { font: 500 16px var(--head); } .teetable .tn i { font: italic 300 13px var(--head); color: var(--brass); margin-left: 6px; }
  .teetable .yd { text-align: right; font: 300 18px var(--head); }
  .teetable tr.on td { background: var(--hunter); color: var(--ivory); } .teetable tr.on .tn i { color: var(--brass); }
  .scorecard { border-collapse: collapse; width: 100%; font: 400 12.5px var(--text); text-align: center; background: var(--paper); }
  .scorecard th { background: var(--hunter); color: var(--ivory); font: 600 10.5px var(--text); letter-spacing: .1em; padding: 6px 2px; border: 1px solid var(--hunter); }
  .scorecard td { padding: 6px 2px; border: 1px solid var(--rule); } .scorecard td:first-child, .scorecard th:first-child { text-align: left; padding-left: 6px; font-weight: 600; letter-spacing: .1em; font-size: 10.5px; }
  .scorecard .out { font-weight: 600; background: #F1EBDB; }
  .navrow { display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 8px 0; border-bottom: 1px solid var(--rule); cursor: pointer; }
  .navrow:last-child { border-bottom: 0; }
  .navrow .grow { flex: 1; } .navrow b { font: 500 17px var(--head); } .navrow small { display: block; color: var(--muted); font-size: 13px; }
  .navrow > span:last-child { color: var(--brass); }
  .dock { position: fixed; left: 0; right: 0; bottom: calc(env(safe-area-inset-bottom, 0px) + 66px); padding: 10px 16px; z-index: 800; background: linear-gradient(#F6F1E400, var(--ivory) 35%); }
  .dock .btn { width: 100%; max-width: 688px; display: block; margin: 0 auto; min-height: 54px; }

  /* hole view: hunter header, full map, ivory sheet */
  .hole { position: fixed; inset: 0; display: flex; flex-direction: column; }
  /* slim one-line header: ‹ Hole 16 › with par and tees beside it, about 56px under the notch */
  .hhead { padding: calc(env(safe-area-inset-top, 0px) + 5px) 8px 5px; display: flex; align-items: center; gap: 4px; z-index: 650; position: relative; }
  .hhead .iconbtn { width: 40px; height: 40px; font-size: 18px; } .hhead .iconbtn svg { width: 20px; height: 20px; }
  .hhead .mid { flex: 1; display: flex; align-items: center; justify-content: center; gap: 0; min-width: 0; }
  .hhead .mid button.nav { all: unset; cursor: pointer; width: 36px; height: 44px; display: grid; place-items: center; font-size: 22px; color: var(--brass); }
  .hhead .ttl { all: unset; cursor: pointer; min-width: 0; display: flex; align-items: baseline; gap: 8px; white-space: nowrap; }
  .hhead .ttl b { font: 300 21px/1 var(--head); color: var(--ivory); }
  .hhead .ttl span { color: var(--brass); font-size: 10px; letter-spacing: .16em; overflow: hidden; text-overflow: ellipsis; }
  .mapwrap { position: relative; flex: 1; min-height: 0; }
  #map { position: absolute; inset: 0; background: #EDE6D2; -webkit-touch-callout: none; }
  .fl { position: absolute; z-index: 600; }
  .rbtn { all: unset; cursor: pointer; width: 44px; height: 44px; border-radius: 999px; background: var(--paper); color: var(--hunter); display: grid; place-items: center;
          box-shadow: inset 0 0 0 1px var(--hunter), 0 1px 6px #1B1B1826; font: 600 13px var(--text); }
  .rbtn svg { width: 20px; height: 20px; }
  .rbtn.on { background: var(--hunter); color: var(--ivory); box-shadow: inset 0 0 0 1px var(--brass), 0 1px 6px #1B1B1826; }
  .rcol { right: 12px; top: 12px; display: flex; flex-direction: column; gap: 10px; }
  .pinlabel { background: var(--paper); color: var(--hunter); border: 1px solid var(--brass); padding: 4px 8px; font: 600 10px var(--text); letter-spacing: .12em; text-transform: uppercase; }
  .slopecap { left: 12px; top: 44px; max-width: calc(100% - 84px); background: #FFFDF7e6; color: var(--ink); border-left: 2px solid var(--claret); padding: 3px 8px; font: italic 400 12.5px var(--head); }
  .hint { left: 50%; transform: translateX(-50%); background: var(--hunter); color: var(--ivory); border: 1px solid var(--brass); padding: 10px 14px; font-size: 13.5px;
          max-width: calc(100% - 32px); display: flex; gap: 12px; align-items: center; }
  .hint button { all: unset; cursor: pointer; color: var(--brass); font: 600 12px var(--text); letter-spacing: .18em; text-transform: uppercase; min-height: 32px; }
  .presets { left: 10px; right: 10px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; max-width: 340px; margin: 0 auto; }
  .presets button { all: unset; cursor: pointer; text-align: center; background: var(--paper); border: 1px solid var(--hunter); min-height: 36px; display: grid; place-items: center; font: 500 12px var(--text); }
  .seg { display: flex; background: var(--paper); border: 1px solid var(--hunter); }
  .seg button { all: unset; cursor: pointer; padding: 8px 12px; font: 500 13px var(--text); }
  .seg button.on { background: var(--hunter); color: var(--ivory); }
  .floatbtn { all: unset; cursor: pointer; background: var(--paper); border: 1px solid var(--hunter); padding: 8px 12px; font: 500 13px var(--text); }
  .floatbtn.on { background: var(--hunter); color: var(--ivory); }
  /* the bottom sheet: three heights (compact / half / full), small type, a slim double brass rule on top */
  .sheet { position: absolute; left: 0; right: 0; bottom: 0; z-index: 700; background: var(--ivory); border-top: .5px solid var(--brass); box-shadow: 0 -3px 14px #1B1B181c;
           padding: 0 14px calc(env(safe-area-inset-bottom, 0px) + 8px); display: flex; flex-direction: column; gap: 10px; overflow-y: auto; height: 160px; transition: height .18s ease;
           font-size: 14px; overscroll-behavior: contain; }
  .sheet.min { overflow: hidden; }
  .sheet.dragging { transition: none; }
  .grab { position: sticky; top: 0; z-index: 2; background: var(--ivory); padding: 7px 0 3px; margin: 0 -14px -4px; display: grid; place-items: center; cursor: grab; touch-action: none;
          box-shadow: inset 0 2px 0 var(--ivory), inset 0 2.5px 0 var(--brass); }
  .grab::before { content: ""; width: 34px; height: 2px; border-top: 1px solid var(--brass); border-bottom: 1px solid var(--brass); opacity: .8; }
  .cmp { display: flex; flex-direction: column; gap: 5px; }
  .yrow { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .ybig { display: flex; align-items: baseline; gap: 2px; flex: 0 0 auto; }
  .ybig b { font: 300 50px/.92 var(--head); letter-spacing: -.02em; color: var(--ink); }
  .ybig i { font: 300 15px var(--head); font-style: normal; color: var(--muted); }
  .ycol { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
  .fmb { display: flex; gap: 14px; align-items: baseline; }
  .fmb span { display: flex; align-items: baseline; gap: 4px; }
  .fmb i { font: 600 10px var(--text); font-style: normal; letter-spacing: .16em; color: var(--muted); }
  .fmb b { font: 300 19px var(--head); } .fmb .m b { font-weight: 500; } .fmb .m i { color: var(--ink); }
  .yttl, .seclbl { font: 600 10.5px var(--text); letter-spacing: .2em; text-transform: uppercase; color: var(--muted); }
  .ysub { font: italic 400 12px var(--head); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cline { display: flex; align-items: baseline; gap: 6px; min-width: 0; white-space: nowrap; overflow: hidden; cursor: pointer; border-top: 1px solid var(--rule); padding-top: 5px; }
  .cline b { font: 500 16px var(--head); } .cline > span { color: var(--ink); }
  .cline .note { font: italic 400 12.5px var(--head); color: var(--claret); overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .hzline { margin-left: auto; padding-left: 8px; font-size: 13px; overflow: hidden; text-overflow: ellipsis; min-width: 0; } .hzline.red { color: var(--claret); }
  .btn.slim { min-height: 40px; padding: 8px 14px; font-size: 11.5px; width: 100%; margin-top: 2px; }
  .more { display: flex; flex-direction: column; gap: 10px; border-top: 1px solid var(--rule); padding-top: 8px; }
  .more:empty { display: none; }
  .sec { display: flex; flex-direction: column; gap: 4px; }
  .clubstrip { display: flex; gap: 6px; overflow-x: auto; margin: 0 -14px; padding: 0 14px 2px; scrollbar-width: none; }
  .clubstrip .chip { flex: 0 0 auto; min-height: 40px; padding: 6px 11px; font-size: 13.5px; }
  .pcard { border: 1px solid var(--rule); background: var(--paper); padding: 8px 10px; display: flex; flex-direction: column; gap: 6px; }
  .pch { display: flex; gap: 8px; align-items: center; } .pch b { flex: 1; font: 500 15px var(--head); } .pch .num { font-weight: 500; }
  .scorerow { display: flex; gap: 10px; align-items: center; } .scorerow b { font: 300 24px var(--head); }
  .sheet .btn.small { min-height: 40px; }
  .sheet .warn, .sheet .carry, .sheet .today { font-size: 13px; padding: 6px 10px; }
  .sheet .muted { font-size: 12.5px; }
  .note { font-size: 13.5px; }
  .pflow { display: flex; flex-direction: column; gap: 10px; } .pflow .row .btn { text-transform: uppercase; }
  .hzlist { display: flex; flex-direction: column; }
  .hzlist .hl { display: flex; align-items: baseline; gap: 8px; padding: 3px 0; font-size: 14px; }
  .hzlist .hl .lead { flex: 1; border-bottom: 1px dotted var(--brass); transform: translateY(-4px); min-width: 12px; }
  .hzlist .hl b { font: 400 14px var(--head); white-space: nowrap; }
  .detail { display: flex; flex-direction: column; gap: 10px; border-top: 1px solid var(--rule); padding-top: 12px; }
  .fcb { display: none; }
  .pl { font-size: 12px; color: #7A5E1F; }
  .hz { font-size: 13px; display: flex; flex-direction: column; gap: 3px; }
  .sw { width: 10px; height: 10px; flex: 0 0 auto; }
  .slope { display: flex; flex-direction: column; gap: 2px; font-size: 14px; } .slope b { font: italic 400 15px var(--head); }
