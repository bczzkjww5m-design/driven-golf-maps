<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Braemar · Short Game</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
  :root {
    --turf: #1f4d2b; --turf-2: #2d6b3c; --chalk: #f7f6f0; --chalk-2: #e3e6dc; --ink: #16231a;
    --flag: #d6452f; --ball: #ffffff; --gps: #2a7de1; --muted: #5c6b60;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  }
  html, body { height: 100%; margin: 0; background: var(--turf); color: var(--ink); }
  body { display: flex; flex-direction: column; -webkit-user-select: none; user-select: none; }
  header { background: var(--turf); color: var(--chalk); padding: calc(env(safe-area-inset-top, 0px) + 8px) 16px 8px;
           display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  header h1 { font-size: 16px; margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .seg { display: flex; background: #ffffff22; border-radius: 9px; padding: 2px; flex: 0 0 auto; }
  .seg button { all: unset; padding: 7px 11px; border-radius: 7px; font: 600 13px system-ui; color: var(--chalk); cursor: pointer; }
  .seg button.on { background: var(--chalk); color: var(--turf); }
  .seg button:focus-visible { outline: 2px solid var(--gps); }

  #mapWrap { flex: 1; min-height: 0; position: relative; }
  #map { position: absolute; inset: 0; background: #a9d48a; -webkit-touch-callout: none; }
  .float { position: absolute; z-index: 500; }
  .chip { all: unset; background: var(--chalk); color: var(--ink); border-radius: 8px; padding: 7px 11px;
          font: 600 13px system-ui; box-shadow: 0 1px 4px #0004; cursor: pointer; }
  .chip.on { background: var(--turf-2); color: var(--chalk); }
  .chip:focus-visible { outline: 2px solid var(--gps); }
  #resetBtn { top: 10px; left: 10px; }
  #baseToggle { top: 10px; right: 10px; display: flex; border-radius: 8px; overflow: hidden; box-shadow: 0 1px 4px #0004; }
  #baseToggle .chip { border-radius: 0; box-shadow: none; }
  #greenChips { top: 50px; left: 10px; display: flex; gap: 6px; flex-wrap: wrap; right: 10px; }
  #hint { left: 50%; transform: translateX(-50%); bottom: 10px; background: #16231ae6; color: var(--chalk);
          padding: 8px 12px; border-radius: 10px; font-size: 13px; display: flex; gap: 10px; align-items: center;
          max-width: calc(100% - 32px); box-sizing: border-box; }
  #hint button { all: unset; font-weight: 700; color: #ffd27a; cursor: pointer; }
  #result { left: 50%; top: 50%; transform: translate(-50%, -50%); background: var(--chalk); border-radius: 16px;
            padding: 16px 22px; text-align: center; box-shadow: 0 6px 24px #0006; min-width: 200px; }
  #result b { display: block; font-size: 38px; line-height: 1.05; font-variant-numeric: tabular-nums; }
  #result div { color: var(--muted); font-size: 14px; margin-top: 4px; }
  #result .miss { color: var(--ink); font-weight: 700; font-size: 17px; }

  .loupe { position: fixed; width: 130px; height: 130px; border-radius: 50%; overflow: hidden; z-index: 2000;
           border: 3px solid #fff; box-shadow: 0 4px 16px #0007; pointer-events: none; background: #a9d48a; }
  .loupe .lm { position: absolute; inset: 0; }
  .loupe::before, .loupe::after { content: ""; position: absolute; background: #16231a; z-index: 1000; }
  .loupe::before { left: 50%; top: 35%; width: 2px; height: 30%; margin-left: -1px; }
  .loupe::after { top: 50%; left: 35%; height: 2px; width: 30%; margin-top: -1px; }

  .panel { background: var(--chalk); padding: 10px 16px calc(env(safe-area-inset-bottom, 0px) + 10px);
           display: flex; flex-direction: column; gap: 8px; }
  .readout { display: flex; align-items: baseline; gap: 10px; min-height: 36px; }
  .readout b { font-size: 32px; font-variant-numeric: tabular-nums; line-height: 1; }
  .readout span { color: var(--muted); font-size: 13px; min-width: 0; }
  .row { display: flex; gap: 8px; }
  .big { flex: 1; font: inherit; font-weight: 650; font-size: 15px; border: 0; border-radius: 10px; padding: 13px 8px;
         background: var(--turf-2); color: var(--chalk); cursor: pointer; }
  .big.alt { background: var(--flag); }
  .big.active { box-shadow: inset 0 0 0 3px #ffd27a; }
  .small { flex: 1; font: inherit; font-weight: 600; font-size: 13px; border: 0; border-radius: 9px; padding: 9px 4px;
           background: var(--chalk-2); color: var(--ink); cursor: pointer; }
  .small.active { background: var(--ink); color: var(--chalk); }
  .small.danger { background: var(--flag); color: #fff; }
  button:disabled { opacity: .4; cursor: default; }
  .big:focus-visible, .small:focus-visible { outline: 3px solid var(--gps); outline-offset: 2px; }
  #msg { font-size: 13px; color: var(--flag); }

  #logSheet { position: fixed; inset: 0; z-index: 3000; background: #0008; display: flex; align-items: flex-end; }
  #logSheet .sheet { background: var(--chalk); width: 100%; max-height: 75%; border-radius: 16px 16px 0 0;
                     display: flex; flex-direction: column; padding-bottom: env(safe-area-inset-bottom, 0px); }
  #logSheet header { background: none; color: var(--ink); padding: 14px 16px 8px; }
  #logList { overflow-y: auto; padding: 0 16px 16px; }
  .entry { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--chalk-2); }
  .entry .what { flex: 1; min-width: 0; font-size: 14px; }
  .entry .what small { display: block; color: var(--muted); font-size: 12px; }
  .entry .ft { font-weight: 700; font-variant-numeric: tabular-nums; }
  .entry button { all: unset; padding: 6px 10px; border-radius: 7px; background: var(--chalk-2); font: 600 13px system-ui; cursor: pointer; }
  .entry button.sure { background: var(--flag); color: #fff; }
  .empty { color: var(--muted); padding: 20px 0; font-size: 14px; }
  .stats { color: var(--muted); font-size: 13px; padding: 0 16px 8px; }

  .pin { display: grid; place-items: center; border-radius: 50%; background: var(--flag); color: #fff;
         border: 2px solid #fff; font: 700 13px system-ui; box-shadow: 0 1px 4px #0007; box-sizing: border-box; }
  .pin.sel { border: 3px solid #ffd27a; transform: scale(1.18); }
  .ballIcon { border-radius: 50%; background: var(--ball); border: 2px solid #16231a; box-shadow: 0 1px 5px #0008; box-sizing: border-box; }
  .finishIcon { border-radius: 50%; background: #16231a99; border: 1.5px solid #fff; box-sizing: border-box; }
  .finishIcon.last { background: #ffd27a; border-color: #16231a; }
  .leaflet-tooltip.yd { background: #16231a; color: #fff; border: 0; font: 700 13px system-ui; padding: 3px 7px; box-shadow: none; }
  .leaflet-tooltip.yd::before { display: none; }
  .leaflet-tooltip.glabel { background: none; border: 0; box-shadow: none; color: #1f4d2b; font: 700 12px system-ui;
                            text-shadow: 0 0 3px #fff, 0 0 3px #fff; }
  .leaflet-tooltip.glabel::before { display: none; }
  [hidden] { display: none !important; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<header>
  <h1>Braemar · Short Game</h1>
  <div class="seg" role="tablist" aria-label="View">
    <button id="shotViewBtn" class="on" role="tab">Shot view</button>
    <button id="greenViewBtn" role="tab">Green view</button>
  </div>
</header>
<div id="mapWrap">
  <div id="map"></div>
  <button class="chip float" id="resetBtn">Reset</button>
  <div class="float" id="baseToggle">
    <button class="chip on" data-base="map">Map</button><button class="chip" data-base="aerial">Aerial</button>
  </div>
  <div class="float" id="greenChips" hidden></div>
  <div class="float" id="hint"><span id="hintText"></span><button id="hintCancel" hidden>Cancel</button></div>
  <div class="float" id="result" hidden></div>
</div>
<div class="panel">
  <div class="readout"><b id="yd">—</b><span id="ydLabel"></span></div>
  <div class="row">
    <button class="big" id="gpsBtn">I'm at my ball</button>
    <button class="big alt" id="finishBtn" disabled>Mark finish</button>
  </div>
  <div class="row">
    <button class="small" id="addBtn">Add hole</button>
    <button class="small" id="moveBtn" disabled>Move hole</button>
    <button class="small" id="removeBtn" disabled>Remove hole</button>
    <button class="small" id="logBtn">Log</button>
  </div>
  <div id="msg" hidden></div>
</div>
<div id="logSheet" hidden>
  <div class="sheet">
    <header><h1>Shot log</h1><button class="small" id="logClose" style="flex:0 0 auto;padding:8px 14px">Done</button></header>
    <div class="stats" id="logStats"></div>
    <div id="logList"></div>
  </div>
</div>

const BOUNDS = [[44.86741536249048, -93.3859399446548], [44.86887905222651, -93.38152345155551]];
const KEY = "driven-practice:" + document.title;
const COLORS = { tree: "#2f6b34", cartpath: "#d9d4c7", collar: "#5cc366", bunker: "#f1e1a6", green: "#8fe07f" };
const M_TO_YD = 1.09361, M_TO_FT = 3.28084;
const RINGS_FT = [3, 6, 10];
const $ = id => document.getElementById(id);

// ---------- saved state (on this phone only) ----------
const load = (k, d) => { try { return JSON.parse(localStorage.getItem(KEY + k)) ?? d; } catch { return d; } };
const save = (k, v) => { try { localStorage.setItem(KEY + k, JSON.stringify(v)); } catch {} };
let pins = load(":pins", []);             // [{id, lat, lng}]
let selectedId = load(":sel", null);

let log = load(":log", []);
let base = load(":base", "map");
let view = "shot";
let mode = "ball";                        // what a tap does: ball | add | move | finish

// ---------- geometry helpers (local flat metres, fine at practice-green scale) ----------
// metres per degree at this latitude (WGS84 series; 110540 is only right at the equator)
const toXY = (p, o) => { const f = o.lat * Math.PI / 180;
  return { x: (p.lng - o.lng) * (111412.84 * Math.cos(f) - 93.5 * Math.cos(3 * f)), y: (p.lat - o.lat) * (111132.92 - 559.82 * Math.cos(2 * f) + 1.175 * Math.cos(4 * f)) }; };
const dist = (a, b) => L.latLng(a).distanceTo(L.latLng(b));
const greens = BASEMAP.features.filter(f => f.properties.kind === "green").map(f => {
  const ring = (f.geometry.type === "Polygon" ? f.geometry.coordinates : f.geometry.coordinates[0])[0];
  const bounds = L.latLngBounds(ring.map(([x, y]) => [y, x]));
  return { label: f.properties.label, ring, bounds, center: bounds.getCenter() };
});
function inRing(p, ring) {
  let inside = false;
  for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) {
    const [xi, yi] = ring[i], [xj, yj] = ring[j];
    if ((yi > p.lat) !== (yj > p.lat) && p.lng < (xj - xi) * (p.lat - yi) / (yj - yi) + xi) inside = !inside;
  }
  return inside;
}
const greenAt = p => greens.find(g => inRing(p, g.ring)) ||
  greens.reduce((a, b) => dist(p, a.center) < dist(p, b.center) ? a : b);
const pinNo = pin => pins.indexOf(pin) + 1;
const selPin = () => pins.find(p => p.id === selectedId) || null;

// ---------- map ----------
const map = L.map("map", { zoomControl: false, maxZoom: 23, zoomSnap: 0.25, zoomDelta: 0.5,
  maxBounds: L.latLngBounds(BOUNDS).pad(0.6), tap: false, doubleClickZoom: false });
map.attributionControl.setPrefix("").addAttribution("Imagery: USDA NAIP · Map data © OpenStreetMap");
// The light-green ground sits lowest, the aerial photo above it, and everything drawn (map shapes, pins, lines) above both.
map.createPane("groundPane").style.zIndex = 250;
map.createPane("aerialPane").style.zIndex = 300;
function baseLayers() {
  return {
    map: L.geoJSON(BASEMAP, { interactive: false,
      style: f => ({ color: "#00000025", weight: 0.6, fillColor: COLORS[f.properties.kind], fillOpacity: 1 }) }),
    aerial: L.imageOverlay(AERIAL, BOUNDS, { interactive: false, pane: "aerialPane" }),
  };
}
const ground = L.rectangle(L.latLngBounds(BOUNDS).pad(0.6), { stroke: false, fillColor: "#a9d48a", fillOpacity: 1, interactive: false, pane: "groundPane" }).addTo(map);
const layers = baseLayers();
layers[base].addTo(map);
greens.forEach(g => L.tooltip({ permanent: true, direction: "center", className: "glabel" })
  .setLatLng(L.latLng(g.bounds.getNorth(), g.center.lng)).setContent(g.label).addTo(map));
const ringLayer = L.layerGroup().addTo(map);
const shotLayer = L.layerGroup().addTo(map);
const finishLayer = L.layerGroup().addTo(map);
const pinLayer = L.layerGroup().addTo(map);
map.fitBounds(BOUNDS);

$("baseToggle").onclick = e => {
  const b = e.target.dataset.base; if (!b || b === base) return;
  layers[base].remove(); base = b; layers[base].addTo(map); layers[base].bringToBack(); ground.bringToBack();
  document.querySelectorAll("#baseToggle .chip").forEach(c => c.classList.toggle("on", c.dataset.base === base));

};
document.querySelectorAll("#baseToggle .chip").forEach(c => c.classList.toggle("on", c.dataset.base === base));

// ---------- markers (pixel-sized icons, so they stay the same size at any zoom) ----------
const pinIcon = (n, sel) => L.divIcon({ className: "", iconSize: [28, 28],
  html: `<div class="pin${sel ? " sel" : ""}" style="width:28px;height:28px">${n}</div>` });
const ballIcon = L.divIcon({ className: "", iconSize: [20, 20], html: '<div class="ballIcon" style="width:20px;height:20px"></div>' });
const finishIcon = last => L.divIcon({ className: "", iconSize: last ? [14, 14] : [10, 10],
  html: `<div class="finishIcon${last ? " last" : ""}" style="width:100%;height:100%"></div>` });
let ballMarker = null;

function draw() {
  pinLayer.clearLayers(); ringLayer.clearLayers(); shotLayer.clearLayers(); finishLayer.clearLayers();
  const sp = selPin();
  pins.forEach(p => {
    const m = L.marker([p.lat, p.lng], { icon: pinIcon(pinNo(p), p.id === selectedId), zIndexOffset: 500,
      draggable: mode === "move" && p.id === selectedId, keyboard: false }).addTo(pinLayer);
    m.on("click", e => {
      if (Date.now() < suppressClickUntil) return;
      if (mode !== "ball") return handleTap(e.latlng);     // finishing or placing right by a hole: treat as a map tap
      selectedId = p.id; save(":sel", selectedId); draw(); refresh(); frame();
    });
    m.on("dragend", e => { const ll = e.target.getLatLng(); movePin(ll); });
  });
  if (sp && view === "green") {
    RINGS_FT.forEach(ft => L.circle([sp.lat, sp.lng], { radius: ft / M_TO_FT, color: "#ffffff", weight: 1.2,

  }
  if (sp) {
    const recent = log.filter(s => s.pinId === sp.id && s.ball && s.finish);
    recent.forEach((s, i) => L.marker(s.finish, { icon: finishIcon(i === recent.length - 1), interactive: false }).addTo(finishLayer));

  if (ball) {
    if (!ballMarker) {
      ballMarker = L.marker([ball.lat, ball.lng], { icon: ballIcon, draggable: true, zIndexOffset: 1000, keyboard: false }).addTo(map);
      ballMarker.on("drag", e => { const ll = e.target.getLatLng(); ball.lat = ll.lat; ball.lng = ll.lng; drawLine(); readout(); });
      ballMarker.on("dragend", () => { ball.src = "adjusted"; save(":ball", ball); readout(); });
    } else ballMarker.setLatLng([ball.lat, ball.lng]);
  } else if (ballMarker) { ballMarker.remove(); ballMarker = null; }
  drawLine();
}
function drawLine() {
  shotLayer.clearLayers();
  const sp = selPin();
  if (!ball || !sp) return;
  const yd = Math.round(dist(ball, sp) * M_TO_YD);
  L.polyline([[ball.lat, ball.lng], [sp.lat, sp.lng]], { color: "#ffffff", weight: 2.5, dashArray: "6 7", interactive: false })
    .bindTooltip(`${yd} yd`, { permanent: true, direction: "center", className: "yd" }).addTo(shotLayer);
}

// ---------- views ----------
function targetGreen() {
  const sp = selPin();
  if (sp) return greenAt(sp);
  if (ball) return greenAt(ball);
  return greenAt(map.getCenter());
}
let greenOverride = null;
function frame() {
  const sp = selPin();
  const pad = { paddingTopLeft: [40, 70], paddingBottomRight: [40, 110] };   // clear of the buttons on top and the hint at the bottom
  if (view === "green") {
    const g = greenOverride || targetGreen();
    map.fitBounds(g.bounds.pad(0.12), { paddingTopLeft: [16, 90], paddingBottomRight: [16, 80], maxZoom: 23 });
  } else if (ball && sp) {
    map.fitBounds(L.latLngBounds([ball, sp]), { ...pad, maxZoom: 22 });
  } else if (ball) {
    map.fitBounds(greenAt(ball).bounds.extend(L.latLng(ball)), { ...pad, maxZoom: 22 });
  } else {
    map.fitBounds(BOUNDS);
  }
}
function setView(v, { refit = true } = {}) {
  view = v;
  $("shotViewBtn").classList.toggle("on", v === "shot");
  $("greenViewBtn").classList.toggle("on", v === "green");
  if (v !== "green") greenOverride = null;
  renderGreenChips();
  draw();
  if (refit) frame();
}
$("shotViewBtn").onclick = () => setView("shot");
$("greenViewBtn").onclick = () => setView("green");
$("resetBtn").onclick = () => frame();
function renderGreenChips() {
  const box = $("greenChips");
  box.hidden = view !== "green";
  const cur = (greenOverride || targetGreen()).label;
  box.innerHTML = "";
  greens.forEach(g => {
    const b = document.createElement("button");
    b.className = "chip" + (g.label === cur ? " on" : "");
    b.textContent = g.label;
    b.onclick = () => { greenOverride = g; renderGreenChips(); frame(); };
    box.appendChild(b);
  });
}

// ---------- modes ----------
const HINTS = {
  ball: () => ball ? (selPin() ? "Drag the ball to fine-tune. Tap a numbered hole to switch." : "Tap a numbered hole to aim at it, or Add hole.")
                   : "Tap or press and hold where your ball is, or use I'm at my ball.",
  add: () => `Tap to place hole ${pins.length + 1}. Press and hold to magnify.`,
  move: () => `Tap or drag to move hole ${pinNo(selPin())}.`,
  finish: () => "Tap where the ball finished. Press and hold to magnify.",
};
function setMode(m) {
  mode = m;
  $("addBtn").classList.toggle("active", m === "add");
  $("moveBtn").classList.toggle("active", m === "move");
  $("finishBtn").classList.toggle("active", m === "finish");
  if (m === "add" || m === "move" || m === "finish") setView("green");
  else draw();
  refresh();
}
$("hintCancel").onclick = () => { setMode("ball"); setView("shot"); };
$("addBtn").onclick = () => mode === "add" ? $("hintCancel").onclick() : setMode("add");
$("moveBtn").onclick = () => mode === "move" ? $("hintCancel").onclick() : setMode("move");
$("finishBtn").onclick = () => mode === "finish" ? $("hintCancel").onclick() : setMode("finish");
let removeArmed = null;
$("removeBtn").onclick = () => {
  const sp = selPin(); if (!sp) return;
  if (!removeArmed) {
    $("removeBtn").textContent = `Remove ${pinNo(sp)}?`; $("removeBtn").classList.add("danger");
    removeArmed = setTimeout(disarmRemove, 3000); return;
  }
  disarmRemove();
  pins = pins.filter(p => p.id !== sp.id); selectedId = pins.at(-1)?.id ?? null;
  save(":pins", pins); save(":sel", selectedId);
  if (mode === "move") setMode("ball"); else { draw(); refresh(); }
  flash(`Hole removed. ${pins.length ? "Holes renumbered." : ""}`);
};
function disarmRemove() { clearTimeout(removeArmed); removeArmed = null; $("removeBtn").textContent = "Remove hole"; $("removeBtn").classList.remove("danger"); }

function handleTap(ll) {
  if (mode === "add") {
    const p = { id: Date.now().toString(36), lat: ll.lat, lng: ll.lng };
    pins.push(p); selectedId = p.id; save(":pins", pins); save(":sel", selectedId);
    setMode("ball"); setView(ball ? "shot" : "green");
  } else if (mode === "move") {
    movePin(ll); setMode("ball"); setView(ball ? "shot" : "green");
  } else if (mode === "finish") {
    finishShot(ll);
  } else {
    placeBall(ll, "tap");
  }
}
function movePin(ll) {
  const sp = selPin(); if (!sp) return;
  sp.lat = ll.lat; sp.lng = ll.lng; save(":pins", pins); draw(); readout();
}
function placeBall(ll, src, acc) {
  ball = { lat: ll.lat, lng: ll.lng, src, acc: acc ?? null }; save(":ball", ball);
  if (!selPin() && pins.length) {   // aim at the nearest hole on the nearest green
    selectedId = pins.reduce((a, b) => dist(ll, a) < dist(ll, b) ? a : b).id; save(":sel", selectedId);
  }
  setView("shot"); refresh();
}

// ---------- the shot result ----------
function finishShot(ll) {
  const sp = selPin(); if (!sp || !ball) return;
  const toPin = toXY(sp, ball), r = toXY(ll, sp);
  const len = Math.hypot(toPin.x, toPin.y) || 1;
  const u = { x: toPin.x / len, y: toPin.y / len };
  const along = (r.x * u.x + r.y * u.y) * M_TO_FT;          // + long, - short
  const cross = (u.x * r.y - u.y * r.x) * M_TO_FT;          // + left, - right (looking at the hole)
  const ft = Math.hypot(r.x, r.y) * M_TO_FT;
  const parts = [];
  if (Math.abs(along) >= 1) parts.push(`${Math.round(Math.abs(along))} ft ${along > 0 ? "long" : "short"}`);
  if (Math.abs(cross) >= 1) parts.push(`${Math.round(Math.abs(cross))} ft ${cross > 0 ? "left" : "right"}`);
  const miss = ft < 1 ? "In or tap-in" : parts.length ? parts.join(" · ") : "On line";
  const entry = { id: Date.now().toString(36), t: Date.now(), pinId: sp.id, hole: pinNo(sp), green: greenAt(sp).label,
    yd: Math.round(len * M_TO_YD), ft: +ft.toFixed(1), along: +along.toFixed(1), cross: +cross.toFixed(1), miss,
    ball: { lat: ball.lat, lng: ball.lng }, pin: { lat: sp.lat, lng: sp.lng }, finish: { lat: ll.lat, lng: ll.lng } };
  log.push(entry); save(":log", log);
  mode = "ball"; $("finishBtn").classList.remove("active");
  draw(); refresh();
  const box = $("result");
  box.innerHTML = `<b>${fmtFt(ft)}</b><div>left from ${entry.yd} yd · hole ${entry.hole}</div><div class="miss">${miss}</div>`;
  box.hidden = false;
  clearTimeout(finishShot.t);
  finishShot.t = setTimeout(() => { box.hidden = true; setView("shot"); }, 2500);
}
const fmtFt = ft => ft < 10 ? `${ft.toFixed(1)} ft` : `${Math.round(ft)} ft`;

// ---------- readout, hint, buttons ----------
function readout() {
  const sp = selPin();
  if (ball && sp) {
    $("yd").textContent = `${Math.round(dist(ball, sp) * M_TO_YD)} yd`;
    const how = ball.src === "gps" ? ` · GPS ±${Math.round(ball.acc * M_TO_YD)} yd, drag to fine-tune` : "";
    $("ydLabel").textContent = `to hole ${pinNo(sp)} · ${greenAt(sp).label}${how}`;
  } else {
    $("yd").textContent = "—";
    $("ydLabel").textContent = !pins.length ? "Add a hole to start" : !ball ? "Place your ball" : "Tap a numbered hole";
  }
}
function refresh() {
  const sp = selPin();
  $("moveBtn").disabled = !sp; $("removeBtn").disabled = !sp;
  $("finishBtn").disabled = !(sp && ball) && mode !== "finish";
  $("logBtn").textContent = log.length ? `Log (${log.length})` : "Log";
  $("hintText").textContent = HINTS[mode]();
  $("hintCancel").hidden = mode === "ball";
  readout();
}
function flash(t) { const m = $("msg"); m.textContent = t; m.hidden = !t; clearTimeout(flash.t); if (t) flash.t = setTimeout(() => m.hidden = true, 4000); }

// ---------- GPS: "I'm at my ball" ----------
$("gpsBtn").onclick = () => {
  if (!("geolocation" in navigator)) return flash("This browser can't share location. Tap the map to place your ball.");
  if (!window.isSecureContext) return flash("Location only works on an https:// address.");
  const btn = $("gpsBtn"); btn.disabled = true; btn.textContent = "Finding you…";
  let best = null;
  const done = () => {
    navigator.geolocation.clearWatch(id); clearTimeout(timer);
    btn.disabled = false; btn.textContent = "I'm at my ball";
    if (!best) return;
    const ll = L.latLng(best.coords.latitude, best.coords.longitude);
    const off = !L.latLngBounds(BOUNDS).contains(ll);
    placeBall(ll, "gps", best.coords.accuracy);
    if (off) flash(`You're ${Math.round(dist(ll, L.latLngBounds(BOUNDS).getCenter()) * M_TO_YD)} yd from the practice area. Tap the map to place the ball instead.`);
  };
  // Collect fixes for up to 6 s and keep the most accurate one
  const id = navigator.geolocation.watchPosition(pos => {
    if (!best || pos.coords.accuracy < best.coords.accuracy) best = pos;
    if (best.coords.accuracy <= 4) done();
  }, err => {
    best = null; done();
    flash(err.code === 1 ? "Location is blocked. Allow location for this site in your browser settings, then reload."
                         : "Couldn't get a GPS fix. Tap the map to place your ball.");
  }, { enableHighAccuracy: true, maximumAge: 0, timeout: 15000 });
  const timer = setTimeout(done, 6000);
};

// ---------- tap, and press-and-hold magnifier ----------
let suppressClickUntil = 0;
map.on("click", e => { if (Date.now() < suppressClickUntil) return; handleTap(e.latlng); });

const HOLD_MS = 350, MOVE_PX = 10, LIFT_PX = 95;
const loupe = document.createElement("div"); loupe.className = "loupe"; loupe.hidden = true;
loupe.innerHTML = '<div class="lm"></div>'; document.body.appendChild(loupe);
let loupeMap = null, loupeBase = null, loupeMarks = null;
const touches = new Map();
let hold = null;   // {timer, start:{x,y}, active, ll}
const mapEl = $("map");
function ptLatLng(e) { return map.mouseEventToLatLng(e); }
function showLoupe(e) {
  const ll = ptLatLng(e); hold.ll = ll;
  loupe.style.left = (e.clientX - 65) + "px";
  loupe.style.top = Math.max(4, e.clientY - 65 - LIFT_PX) + "px";
  loupeMap.setView(ll, Math.min(map.getZoom() + 2, 24), { animate: false });
}
function startHold(e) {
  hold.active = true;
  map.dragging.disable(); map.touchZoom.disable();
  if (!loupeMap) {
    loupe.hidden = false;
    loupeMap = L.map(loupe.firstChild, { zoomControl: false, attributionControl: false, dragging: false, touchZoom: false,
      scrollWheelZoom: false, doubleClickZoom: false, boxZoom: false, keyboard: false, maxZoom: 25, zoomSnap: 0 });
    L.rectangle(L.latLngBounds(BOUNDS).pad(0.6), { stroke: false, fillColor: "#a9d48a", fillOpacity: 1 }).addTo(loupeMap);
    loupeMarks = L.layerGroup().addTo(loupeMap);
  }
  loupe.hidden = false;
  if (loupeBase !== base) {
    loupeMap.eachLayer(l => { if (l instanceof L.GeoJSON || l instanceof L.ImageOverlay) loupeMap.removeLayer(l); });
    baseLayers()[base].addTo(loupeMap); loupeBase = base;
  }
  loupeMarks.clearLayers();
  pins.forEach(p => L.circleMarker([p.lat, p.lng], { radius: 6, color: "#fff", weight: 2, fillColor: "#d6452f", fillOpacity: 1 }).addTo(loupeMarks));
  if (ball) L.circleMarker([ball.lat, ball.lng], { radius: 5, color: "#16231a", weight: 2, fillColor: "#fff", fillOpacity: 1 }).addTo(loupeMarks);
  const sp = selPin();
  if (sp) RINGS_FT.forEach(ft => L.circle([sp.lat, sp.lng], { radius: ft / M_TO_FT, color: "#fff", weight: 1, fill: false }).addTo(loupeMarks));
  loupeMap.invalidateSize({ animate: false });
  showLoupe(e);
  if (navigator.vibrate) navigator.vibrate(10);
}
function endHold() {
  if (!hold) return;
  clearTimeout(hold.timer);
  if (hold.active) { loupe.hidden = true; map.dragging.enable(); map.touchZoom.enable(); }
  hold = null;
}
mapEl.addEventListener("pointerdown", e => {
  touches.set(e.pointerId, e);
  const onMarker = e.target.closest(".leaflet-marker-icon");
  if (onMarker && (mode === "ball" || mode === "move")) return;  // let markers be tapped / dragged
  if (touches.size > 1) return endHold();                        // pinch: not a hold
  if (e.pointerType === "mouse" && e.button !== 0) return;
  const start = { x: e.clientX, y: e.clientY };
  hold = { start, active: false, ll: null, last: e };
  hold.timer = setTimeout(() => hold && startHold(hold.last), HOLD_MS);
}, true);
mapEl.addEventListener("pointermove", e => {
  if (touches.has(e.pointerId)) touches.set(e.pointerId, e);
  if (!hold) return;
  hold.last = e;
  if (!hold.active) {
    if (Math.hypot(e.clientX - hold.start.x, e.clientY - hold.start.y) > MOVE_PX) endHold();   // it's a pan
    return;
  }
  e.preventDefault(); e.stopPropagation();
  showLoupe(e);
}, true);
function pointerEnd(e) {
  touches.delete(e.pointerId);
  if (hold?.active) {
    e.preventDefault(); e.stopPropagation();
    const ll = hold.ll;
    suppressClickUntil = Date.now() + 500;
    endHold();
    handleTap(ll);
  } else endHold();
}
mapEl.addEventListener("pointerup", pointerEnd, true);
mapEl.addEventListener("pointercancel", e => { touches.delete(e.pointerId); endHold(); }, true);
mapEl.addEventListener("contextmenu", e => e.preventDefault());

// ---------- shot log ----------
$("logBtn").onclick = () => { renderLog(); $("logSheet").hidden = false; };
$("logClose").onclick = () => { $("logSheet").hidden = true; };
$("logSheet").onclick = e => { if (e.target.id === "logSheet") $("logSheet").hidden = true; };
function renderLog() {
  const list = $("logList"); list.innerHTML = "";
  if (!log.length) { list.innerHTML = '<div class="empty">No shots yet. Place your ball, pick a hole, hit, then Mark finish.</div>'; $("logStats").textContent = ""; return; }
  const avg = log.reduce((s, x) => s + x.ft, 0) / log.length;
  const inSix = log.filter(x => x.ft <= 6).length;
  $("logStats").textContent = `${log.length} shots · average ${fmtFt(avg)} left · ${inSix} inside 6 ft`;
  [...log].reverse().forEach(s => {
    const row = document.createElement("div"); row.className = "entry";
    const time = new Date(s.t).toLocaleString([], { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });
    row.innerHTML = `<div class="what"><span class="ft">${fmtFt(s.ft)}</span> from ${s.yd} yd · ${s.miss}
      <small>${time} · hole ${s.hole}, ${s.green}</small></div>`;
    const del = document.createElement("button"); del.textContent = "Delete";
    del.onclick = () => {
      if (!del.classList.contains("sure")) { del.classList.add("sure"); del.textContent = "Sure?"; setTimeout(() => { del.classList.remove("sure"); del.textContent = "Delete"; }, 3000); return; }
      log = log.filter(x => x.id !== s.id); save(":log", log); renderLog(); draw(); refresh();
    };
    row.appendChild(del); list.appendChild(row);
  });
}

// ---------- start ----------
if (selectedId && !selPin()) selectedId = null;
draw(); refresh(); setView("shot");
</script>
</body>
</html>
